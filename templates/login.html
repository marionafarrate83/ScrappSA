<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | ScrapSA.app</title>
  {% include 'partials/brand_head.html' %}
  <script src="{{ url_for('static', filename='brand/password.js') }}" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='brand/auth.css') }}">
</head>
<body>
  <header class="topbar">{% include 'partials/logo.html' %}</header>
  <main class="auth-wrap">
    <section class="card auth-card" aria-labelledby="login-title">
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="intro">Entra a tu directorio, listas y herramientas de prospección.</p>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <form method="POST" action="/login">
        <div class="field"><label for="username">Correo electrónico</label><input id="username" type="email" name="username" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
        <button type="submit" class="btn">Entrar</button>
      </form>
      <p class="alt-link">¿Aún no tienes acceso? <a href="/{{ utm_suffix }}#precios">Conoce el paquete Estándar de pago único</a>.</p>
    </section>
    <p class="slogan">Encuentra. Prospecta. Vende.</p>
  </main>
</body>
</html>
